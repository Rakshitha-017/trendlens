# Render Blueprint — auto-deploy from GitHub
# https://render.com/docs/blueprint-spec

services:
  # Python backend
  - type: web
    name: trendlens-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.api
    envVars:
      - key: TRENDLENS_API_HOST
        value: 0.0.0.0
      - key: TRENDLENS_API_PORT
        value: 10000
      - key: TRENDLENS_LIVE_SOURCE
        value: auto
      - key: PYTHON_VERSION
        value: 3.12.0

  # React frontend
  - type: web
    name: trendlens-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx tsx server.ts
    envVars:
      - key: TRENDLENS_API_HOST
        value: trendlens-api
      - key: TRENDLENS_API_PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.0.0
